name: "Lint"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  ruff:
    name: "Ruff"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7"

        - name: Ruff Check
          uses: astral-sh/ruff-action@v4.1.0
          with:
            args: check --output-format=github

        - name: Ruff Format
          uses: astral-sh/ruff-action@v4.1.0
          with:
            args: format --check --diff
  mypy:
    runs-on: ubuntu-latest

    steps:
        - name: Checkout code
          uses: actions/checkout@v7

        - name: Install uv
          uses: astral-sh/setup-uv@v10.0.1
          with:
            enable-cache: true

        - name: Set up Python
          run: uv python install

        - name: Install dependencies
          run: uv sync

        - name: Run mypy
          run: uv run mypy custom_components/syncleo/ --check-untyped-defs
